<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Violin Tuner">
<title>Five-String Violin Tuner</title>
<style>
/* Layout idea: one phone-width column. Pick a string, watch one meter, read one verdict. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #1d2230;
  --muted: #5d6477;
  --line: #d3d7df;
  --accent: #8a2f3b;
  --accent-ink: #ffffff;
  --accent-soft: #f4e4e6;
  --good: #1f7a4d;
  --good-soft: #dff1e7;
  --font-display: Georgia, "Times New Roman", serif;
  --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #14161c;
    --surface: #1e212a;
    --ink: #eceef3;
    --muted: #9ba2b4;
    --line: #333846;
    --accent: #e0848f;
    --accent-ink: #1b1113;
    --accent-soft: #3a2327;
    --good: #5fcf96;
    --good-soft: #1d3529;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 460px;
  margin: 0 auto;
  padding: 20px 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
h1 { font-family: var(--font-display); font-size: 26px; line-height: 1.1; margin: 0; }
h2 {
  font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
p { margin: 0; }
section { display: flex; flex-direction: column; gap: 10px; }
button {
  font: inherit; color: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.strings { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.strings button {
  min-height: 64px;
  padding: 6px 0;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.strings .note { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; }
.strings .hz { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.strings button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.strings button[aria-pressed="true"] .hz { color: var(--accent-ink); }

.panel {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 18px 16px;
  display: flex; flex-direction: column; gap: 14px;
  text-align: center;
}
.panel.good { background: var(--good-soft); border-color: var(--good); }
.verdict { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; min-height: 1.1em; }
.panel.good .verdict { color: var(--good); }
.detail { color: var(--muted); font-size: 15px; min-height: 1.45em; font-variant-numeric: tabular-nums; }
.panel.stale .verdict, .panel.stale .marker { opacity: 0.4; }

.meter { position: relative; height: 56px; }
.track {
  position: absolute; left: 0; right: 0; top: 24px; height: 8px;
  background: var(--line); border-radius: 99px;
}
.zone {
  position: absolute; top: 14px; height: 28px; left: 46%; width: 8%;
  background: var(--good); opacity: 0.3; border-radius: 6px;
}
.centre { position: absolute; top: 8px; height: 40px; left: 50%; width: 2px; margin-left: -1px; background: var(--good); }
.marker {
  position: absolute; top: 6px; left: 50%; width: 14px; height: 44px; margin-left: -7px;
  background: var(--ink); border-radius: 7px;
  transition: left 90ms linear;
}
.panel.good .marker { background: var(--good); }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.go {
  width: 100%; min-height: 54px; border-radius: 14px; border: none;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px;
}
.error { color: var(--accent); font-size: 15px; }
.error:empty { display: none; }

.setting {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
}
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line);
  background: var(--bg); font-size: 22px; line-height: 1;
}
.stepper output { min-width: 6.5ch; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 99px; overflow: hidden; }
.seg button { min-height: 40px; padding: 6px 14px; border: none; background: var(--bg); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
footer { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Five-String Violin Tuner</h1>

  <section aria-labelledby="h-strings">
    <h2 id="h-strings">String you are tuning</h2>
    <div class="strings" id="strings"></div>
  </section>

  <div class="panel stale" id="panel">
    <div class="verdict" id="verdict" aria-live="polite">Tap Start</div>
    <div class="meter" aria-hidden="true">
      <div class="track"></div>
      <div class="zone"></div>
      <div class="centre"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="scale" aria-hidden="true"><span>&minus;50 flat</span><span>in tune</span><span>sharp +50</span></div>
    <div class="detail" id="detail">The tuner listens for the string you picked.</div>
  </div>

  <button class="go" id="go" type="button">Start listening</button>
  <p class="error" id="error" role="alert"></p>

  <section aria-labelledby="h-settings">
    <h2 id="h-settings">Settings</h2>
    <div class="setting">
      <span id="l-ref">A string pitch</span>
      <div class="stepper" role="group" aria-labelledby="l-ref">
        <button type="button" id="ref-down" aria-label="Lower A by 1 hertz">&minus;</button>
        <output id="ref-out">440 Hz</output>
        <button type="button" id="ref-up" aria-label="Raise A by 1 hertz">+</button>
      </div>
    </div>
    <div class="setting">
      <span id="l-temp">Fifths</span>
      <div class="seg" role="group" aria-labelledby="l-temp">
        <button type="button" id="temp-equal" aria-pressed="true">Equal (piano)</button>
        <button type="button" id="temp-pure" aria-pressed="false">Pure</button>
      </div>
    </div>
  </section>

  <footer>Bow a long, steady open string close to the phone. Plucked notes fade too fast to read well.</footer>
</main>

<script>
/*DETECT-START*/
// Finds the pitch nearest targetHz (within about a major third either side) in a block of samples.
// Returns { freq, clarity } or null when there is no clear note in that range.
function detectPitch(buf, sampleRate, targetHz) {
  var n = buf.length, i, tau;
  var sum = 0;
  for (i = 0; i < n; i++) sum += buf[i] * buf[i];
  if (Math.sqrt(sum / n) < 0.003) return null;

  var minTau = Math.floor(sampleRate / (targetHz * 1.297));
  var maxTau = Math.ceil(sampleRate / (targetHz / 1.297));
  if (minTau < 2 || maxTau >= n / 2) return null;
  var w = n - maxTau;
  var count = maxTau - minTau + 1;
  var nsdf = new Float32Array(count);
  var best = -1, bestVal = -Infinity;
  for (tau = minTau; tau <= maxTau; tau++) {
    var acf = 0, m = 0;
    for (i = 0; i < w; i++) {
      var a = buf[i], b = buf[i + tau];
      acf += a * b;
      m += a * a + b * b;
    }
    var v = m > 0 ? (2 * acf) / m : 0;
    nsdf[tau - minTau] = v;
    if (v > bestVal) { bestVal = v; best = tau - minTau; }
  }
  if (best <= 0 || best >= count - 1) return null;   // loudest match is at the edge: note is out of range
  if (bestVal < 0.8) return null;
  var y0 = nsdf[best - 1], y1 = nsdf[best], y2 = nsdf[best + 1];
  var denom = y0 - 2 * y1 + y2;
  var shift = denom !== 0 ? 0.5 * (y0 - y2) / denom : 0;
  return { freq: sampleRate / (best + minTau + shift), clarity: bestVal };
}
/*DETECT-END*/

(function () {
  "use strict";
  var STRINGS = [
    { name: "C", semis: -21, pure: 8 / 27 },
    { name: "G", semis: -14, pure: 4 / 9 },
    { name: "D", semis: -7,  pure: 2 / 3 },
    { name: "A", semis: 0,   pure: 1 },
    { name: "E", semis: 7,   pure: 3 / 2 }
  ];
  var REF_MIN = 415, REF_MAX = 446, IN_TUNE = 4;
  var state = { ref: 440, pure: false, sel: 3, listening: false };
  try {
    var s = JSON.parse(localStorage.getItem("violin5-mic") || "null");
    if (s) {
      if (s.ref >= REF_MIN && s.ref <= REF_MAX) state.ref = Math.round(s.ref);
      state.pure = !!s.pure;
      if (s.sel >= 0 && s.sel < 5) state.sel = s.sel | 0;
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem("violin5-mic", JSON.stringify({ ref: state.ref, pure: state.pure, sel: state.sel })); } catch (e) {}
  }
  function target(i) {
    var st = STRINGS[i];
    return state.pure ? state.ref * st.pure : state.ref * Math.pow(2, st.semis / 12);
  }

  var $ = function (id) { return document.getElementById(id); };
  var panel = $("panel"), verdict = $("verdict"), detail = $("detail"), marker = $("marker");
  var goBtn = $("go"), errEl = $("error"), stringsEl = $("strings");
  var btns = [];

  STRINGS.forEach(function (st, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.id = "string-" + st.name;
    b.innerHTML = '<span class="note">' + st.name + '</span><span class="hz"></span>';
    b.addEventListener("click", function () { state.sel = i; history.length = 0; lastHeard = 0; save(); render(); idle(); });
    stringsEl.appendChild(b);
    btns.push(b);
  });

  function render() {
    STRINGS.forEach(function (st, i) {
      btns[i].setAttribute("aria-pressed", i === state.sel ? "true" : "false");
      btns[i].setAttribute("aria-label", st.name + " string, " + target(i).toFixed(1) + " hertz");
      btns[i].querySelector(".hz").textContent = target(i).toFixed(1);
    });
    $("ref-out").textContent = state.ref + " Hz";
    $("ref-down").disabled = state.ref <= REF_MIN;
    $("ref-up").disabled = state.ref >= REF_MAX;
    $("temp-equal").setAttribute("aria-pressed", state.pure ? "false" : "true");
    $("temp-pure").setAttribute("aria-pressed", state.pure ? "true" : "false");
    goBtn.textContent = state.listening ? "Stop listening" : "Start listening";
  }

  function idle() {
    panel.className = "panel stale";
    marker.style.left = "50%";
    if (state.listening) {
      verdict.textContent = "Play your " + STRINGS[state.sel].name;
      detail.textContent = "Listening for a note near " + target(state.sel).toFixed(1) + " Hz.";
    } else {
      verdict.textContent = "Tap Start";
      detail.textContent = "The tuner listens for the string you picked.";
    }
  }

  // ---------- Microphone ----------
  var ctx = null, analyser = null, stream = null, source = null, buf = null, raf = 0;
  var history = [], lastHeard = 0, lastRun = 0;

  function show(cents, freq) {
    var c = Math.round(cents);
    var pos = 50 + Math.max(-50, Math.min(50, cents));
    marker.style.left = pos + "%";
    var name = STRINGS[state.sel].name;
    if (Math.abs(cents) <= IN_TUNE) {
      panel.className = "panel good";
      verdict.textContent = "In tune";
    } else if (cents < 0) {
      panel.className = "panel";
      verdict.textContent = "Flat, tighten";
    } else {
      panel.className = "panel";
      verdict.textContent = "Sharp, loosen";
    }
    detail.textContent = name + " string: " + (c > 0 ? "+" : c < 0 ? "−" : "") + Math.abs(c) +
      " cents (" + freq.toFixed(1) + " Hz, target " + target(state.sel).toFixed(1) + ")";
  }

  function tick(now) {
    raf = requestAnimationFrame(tick);
    if (now - lastRun < 60) return;
    lastRun = now;
    analyser.getFloatTimeDomainData(buf);
    var t = target(state.sel);
    var r = detectPitch(buf, ctx.sampleRate, t);
    if (r) {
      history.push(1200 * Math.log(r.freq / t) / Math.LN2);
      if (history.length > 5) history.shift();
      var sorted = history.slice().sort(function (a, b) { return a - b; });
      var med = sorted[sorted.length >> 1];
      lastHeard = now;
      show(med, t * Math.pow(2, med / 1200));
    } else if (lastHeard && now - lastHeard > 400) {
      history.length = 0;
      if (now - lastHeard > 2500) { lastHeard = 0; idle(); }
      else panel.classList.add("stale");
    }
  }

  function stop() {
    state.listening = false;
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(function (tr) { tr.stop(); });
    if (source) { try { source.disconnect(); } catch (e) {} }
    stream = source = null;
    history.length = 0; lastHeard = 0;
    render(); idle();
  }

  function start() {
    errEl.textContent = "";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errEl.textContent = "The microphone is not available here. Open this page in Safari from an https web address.";
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!ctx) ctx = new AC();
    if (ctx.state !== "running") { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (ms) {
      stream = ms;
      source = ctx.createMediaStreamSource(ms);
      analyser = ctx.createAnalyser();
      analyser.fftSize = ctx.sampleRate > 60000 ? 8192 : 4096;
      analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(analyser.fftSize);
      source.connect(analyser);
      state.listening = true;
      render(); idle();
      raf = requestAnimationFrame(tick);
    }).catch(function (e) {
      errEl.textContent = (e && (e.name === "NotAllowedError" || e.name === "SecurityError"))
        ? "Microphone access was blocked. Allow the microphone for this page, then tap Start again."
        : "Could not open the microphone. Close other apps that are recording, then tap Start again.";
    });
  }

  goBtn.addEventListener("click", function () { if (state.listening) stop(); else start(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && state.listening) stop(); });

  function change(fn) { fn(); history.length = 0; save(); render(); }
  $("ref-down").addEventListener("click", function () { change(function () { state.ref = Math.max(REF_MIN, state.ref - 1); }); });
  $("ref-up").addEventListener("click", function () { change(function () { state.ref = Math.min(REF_MAX, state.ref + 1); }); });
  $("temp-equal").addEventListener("click", function () { change(function () { state.pure = false; }); });
  $("temp-pure").addEventListener("click", function () { change(function () { state.pure = true; }); });

  render(); idle();
})();
</script>
</body>
</html>
